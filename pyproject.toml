readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.0.1",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.1",
    "langchain-google-genai>=0.0.1",
    "google-generativeai>=0.5.0",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "ipython>=9.10.0",
    "requests>=2.31.0",
    "mcp>=1.0.0",
    "httpx>=0.24.0",
    "copilotkit>=0.1.79",
    "langchain-openai>=1.1.10",
    "pypdf>=5.4.0",
]

